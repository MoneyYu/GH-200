# 07 - 對照組：用 SSH 部署到 VM
#
# 教學重點 (Module 5：為什麼要用 OIDC)
#   把這支和 04 放在一起比較，學員會很有感：
#
#   SSH 這條路需要：
#     1. VM 對外開放 port 22
#     2. 把「長期有效」的私鑰存進 GitHub Secret
#     3. 私鑰外洩 = 有人可以直接登入你的機器，而且你不會馬上知道
#     4. 金鑰要自己輪替
#
#   OIDC (04) 需要：
#     1. 不用開任何 inbound port
#     2. GitHub 不存任何長期憑證，每次執行換發短期 token
#     3. 可以限制只有特定 repo / branch / environment 換得到 token
#
# 結論：SSH 能動，但 OIDC 才是現在的建議做法。
name: demo-java-07-deploy-ssh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-ssh:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./mvnw -B verify

      # 私鑰是長期憑證，只能放 secret，絕對不能印出來
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ vars.VM_PUBLIC_IP }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Copy jar to VM
        run: |
          scp -i ~/.ssh/id_deploy target/simpleweb.jar \
            azureuser@${{ vars.VM_PUBLIC_IP }}:~/simpleweb.jar

      - name: Restart service on VM
        run: |
          ssh -i ~/.ssh/id_deploy azureuser@${{ vars.VM_PUBLIC_IP }} \
            "set -euo pipefail
             sudo install -o simpleweb -g simpleweb -m 0644 ~/simpleweb.jar /opt/simpleweb/test/simpleweb.jar
             rm -f ~/simpleweb.jar
             printf 'APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n' '${{ github.sha }}' \"\$(date -u +%FT%TZ)\" | sudo tee /opt/simpleweb/test/app.env >/dev/null
             sudo systemctl restart simpleweb-test
             sleep 5
             sudo systemctl is-active simpleweb-test"

      # 用完就把私鑰刪掉，減少殘留在 runner 上的時間
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy

      - name: Smoke test
        run: |
          for i in $(seq 1 10); do
            curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8080/api/info" && exit 0
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          exit 1
