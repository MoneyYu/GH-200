# 04 - Deploy 到「測試環境」：OIDC + az vm run-command
#
# 教學重點 (Module 1 / Module 5)
#   - environment: test  → 綁定 GitHub Environment，可掛保護規則與環境層級 secret
#   - permissions: id-token: write  → 少了這行，OIDC 一定失敗（最常見的坑）
#   - azure/login 用 OIDC：GitHub 換發「短期 token」給 Azure，
#     GitHub 這邊「不需要存任何長期的 Azure 密碼」
#   - az vm run-command：不用開 SSH port、不用存私鑰，就能在 VM 上執行指令
#
# 部署載荷怎麼上 VM？
#   GH-200 是 private repo，所以不能匿名下載 GitHub Release asset。
#   Workflow 用 OIDC 上傳到 private Azure Blob；VM 用 system-assigned identity 下載。
name: demo-java-04-deploy-test

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC 換發 token 必要！

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    # 這一行讓 run 出現在 Environments 頁面，也是套用保護規則的依據
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./mvnw -B verify

      # 使用 OIDC 登入 Azure（沒有任何長期密碼存在 GitHub）
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Upload immutable deployment assets
        run: |
          printf '%s\n' "$GITHUB_SHA" > build-sha.txt
          sha256sum target/simpleweb.jar | awk '{print $1 "  simpleweb.jar"}' > simpleweb.jar.sha256
          for file in simpleweb.jar simpleweb.jar.sha256 build-sha.txt; do
            source="target/$file"
            [ "$file" = "simpleweb.jar" ] || source="$file"
            az storage blob upload \
              --auth-mode login \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --container-name deployments \
              --name "builds/${GITHUB_SHA}/$file" \
              --file "$source" \
              --overwrite true \
              --output none
          done

      # 共享課程訂閱可能有外部 auto-shutdown；部署前先確保 VM 正在執行。
      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy to test VM
        run: |
          output="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "${{ vars.AZURE_STORAGE_ACCOUNT }}" "${{ github.sha }}" \
            --scripts '
              set -eu
              ACCOUNT="$1"; SHA="$2"
              TOKEN_JSON="$(curl -fsS -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F")"
              TOKEN="$(printf "%s" "$TOKEN_JSON" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")"
              test -n "$TOKEN"
              BASE="https://${ACCOUNT}.blob.core.windows.net/deployments/builds/${SHA}"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar "$BASE/simpleweb.jar"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar.sha256 "$BASE/simpleweb.jar.sha256"
              cd /tmp
              sha256sum -c simpleweb.jar.sha256
              install -o simpleweb -g simpleweb -m 0644 /tmp/simpleweb.jar /opt/simpleweb/test/simpleweb.jar
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%FT%TZ)" > /opt/simpleweb/test/app.env
              systemctl restart simpleweb-test
              sleep 5
              systemctl is-active simpleweb-test
              echo DEPLOY_OK
            ' \
            --query "value[0].message" -o tsv)"
          echo "$output"
          printf '%s' "$output" | grep -q DEPLOY_OK

      # 部署完一定要驗證，不要只看 workflow 綠燈就當成功
      - name: Smoke test
        run: |
          body=''
          for i in $(seq 1 10); do
            body="$(curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8080/api/info" || true)"
            if printf '%s' "$body" | grep -q "${{ github.sha }}"; then
              echo "$body"
              echo "" && echo "測試環境部署成功"
              exit 0
            fi
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          echo "應用程式在時間內沒有回報這次 commit" >&2
          echo "最後回應：$body" >&2
          exit 1
