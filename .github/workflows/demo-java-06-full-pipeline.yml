# 06 - 完整流水線：Build → Test → Package → Deploy(test) → 核准 → Deploy(prod)
#
# 這支就是課程的終極目標：客戶希望學員上完課能自己寫出這樣一條流水線。
#
# 教學重點
#   - 一條 workflow 裡用 needs: 串出階段
#   - build once, deploy many：只 build 一次，兩個環境部署同一份產物
#   - workflow_dispatch 的 confirm_production 是此 repo 的人工確認；真 required-reviewer
#     gate 請使用 MoneyDemo 班級 repo
#   - 每個階段都有驗證，不是丟出去就算完
name: demo-java-06-full-pipeline

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: 輸入 deploy 以允許本次流程部署 production
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: simpleweb-deploy
  cancel-in-progress: false

jobs:
  # ---------- 1. Build & Test ----------
  build:
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and test
        run: ./mvnw -B verify

      - name: Collect metadata
        id: meta
        run: echo "sha_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Upload deployable jar
        uses: actions/upload-artifact@v7
        with:
          name: simpleweb-jar
          path: target/simpleweb.jar
          if-no-files-found: error

  # ---------- 2. Package ----------
  package:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    environment: test
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: simpleweb-jar
          path: ./dist

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Publish immutable deployment assets
        run: |
          printf '%s\n' "$GITHUB_SHA" > ./dist/build-sha.txt
          sha256sum ./dist/simpleweb.jar | awk '{print $1 "  simpleweb.jar"}' > ./dist/simpleweb.jar.sha256
          for file in simpleweb.jar simpleweb.jar.sha256 build-sha.txt; do
            az storage blob upload \
              --auth-mode login \
              --account-name "${{ vars.AZURE_STORAGE_ACCOUNT }}" \
              --container-name deployments \
              --name "builds/${GITHUB_SHA}/$file" \
              --file "./dist/$file" \
              --overwrite true \
              --output none
          done

  # ---------- 3. Deploy 到測試環境（自動） ----------
  deploy-test:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
      id-token: write
    environment:
      name: test
      url: http://${{ vars.VM_PUBLIC_IP }}:8080
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 共享課程訂閱可能有外部 auto-shutdown；部署前先確保 VM 正在執行。
      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy
        run: |
          output="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "${{ vars.AZURE_STORAGE_ACCOUNT }}" "${{ github.sha }}" \
            --scripts '
              set -eu
              ACCOUNT="$1"; SHA="$2"
              TOKEN_JSON="$(curl -fsS -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F")"
              TOKEN="$(printf "%s" "$TOKEN_JSON" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")"
              test -n "$TOKEN"
              BASE="https://${ACCOUNT}.blob.core.windows.net/deployments/builds/${SHA}"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar "$BASE/simpleweb.jar"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar.sha256 "$BASE/simpleweb.jar.sha256"
              cd /tmp
              sha256sum -c simpleweb.jar.sha256
              install -o simpleweb -g simpleweb -m 0644 /tmp/simpleweb.jar /opt/simpleweb/test/simpleweb.jar
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%FT%TZ)" > /opt/simpleweb/test/app.env
              systemctl restart simpleweb-test
              sleep 5
              systemctl is-active simpleweb-test
              echo DEPLOY_OK
            ' \
            --query "value[0].message" -o tsv)"
          echo "$output"
          printf '%s' "$output" | grep -q DEPLOY_OK

      - name: Smoke test
        run: |
          body=''
          for i in $(seq 1 10); do
            body="$(curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8080/api/info" || true)"
            printf '%s' "$body" | grep -q "${{ github.sha }}" && { echo "$body"; exit 0; }
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          echo "最後回應：$body" >&2
          exit 1

  # ---------- 4. Deploy 到正式環境（需明確輸入 confirm_production=deploy） ----------
  deploy-prod:
    runs-on: ubuntu-latest
    if: inputs.confirm_production == 'deploy'
    # 必須把 build 也列進 needs，否則 needs.build.outputs 讀不到值
    needs: [build, deploy-test]
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: http://${{ vars.VM_PUBLIC_IP }}:8081
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # 共享課程訂閱可能有外部 auto-shutdown；部署前先確保 VM 正在執行。
      - name: Ensure VM is running
        run: |
          az vm start \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}"

      - name: Deploy
        run: |
          output="$(az vm run-command invoke \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AZURE_VM_NAME }}" \
            --command-id RunShellScript \
            --parameters "${{ vars.AZURE_STORAGE_ACCOUNT }}" "${{ github.sha }}" \
            --scripts '
              set -eu
              ACCOUNT="$1"; SHA="$2"
              TOKEN_JSON="$(curl -fsS -H Metadata:true "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fstorage.azure.com%2F")"
              TOKEN="$(printf "%s" "$TOKEN_JSON" | sed -n "s/.*\"access_token\":\"\([^\"]*\)\".*/\1/p")"
              test -n "$TOKEN"
              BASE="https://${ACCOUNT}.blob.core.windows.net/deployments/builds/${SHA}"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar "$BASE/simpleweb.jar"
              curl -fsSL --retry 3 -H "Authorization: Bearer $TOKEN" -H "x-ms-version: 2023-11-03" -o /tmp/simpleweb.jar.sha256 "$BASE/simpleweb.jar.sha256"
              cd /tmp
              sha256sum -c simpleweb.jar.sha256
              install -o simpleweb -g simpleweb -m 0644 /tmp/simpleweb.jar /opt/simpleweb/prod/simpleweb.jar
              printf "APP_BUILD_SHA=%s\nAPP_BUILD_TIME=%s\n" "$SHA" "$(date -u +%FT%TZ)" > /opt/simpleweb/prod/app.env
              systemctl restart simpleweb-prod
              sleep 5
              systemctl is-active simpleweb-prod
              echo DEPLOY_OK
            ' \
            --query "value[0].message" -o tsv)"
          echo "$output"
          printf '%s' "$output" | grep -q DEPLOY_OK

      - name: Smoke test
        run: |
          body=''
          for i in $(seq 1 10); do
            body="$(curl -fsS "http://${{ vars.VM_PUBLIC_IP }}:8081/api/info" || true)"
            printf '%s' "$body" | grep -q "${{ github.sha }}" && { echo "$body"; exit 0; }
            echo "等待應用程式啟動... ($i/10)" && sleep 6
          done
          echo "最後回應：$body" >&2
          exit 1

      - name: Write job summary
        run: |
          {
            echo "## 部署完成"
            echo ""
            echo "| 環境 | 網址 |"
            echo "| --- | --- |"
            echo "| test | http://${{ vars.VM_PUBLIC_IP }}:8080 |"
            echo "| production | http://${{ vars.VM_PUBLIC_IP }}:8081 |"
            echo ""
            echo "版本：\`${{ needs.build.outputs.sha_short }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
