server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: simpleweb

app:
  name: SimpleWeb
  version: @project.version@
  environment: ${APP_ENVIRONMENT:local}
  build:
    sha: @app.build.sha@
    time: @app.build.time@

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
